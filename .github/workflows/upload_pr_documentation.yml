name: Upload PR Documentation

on:
  workflow_run:
    workflows: ["Build PR documentation"]
    types:
      - completed

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/upload_pr_documentation.yml@692a9837221905b9fd5a4c7e4e141e4671de0fa0  # main
    with:
      package_name: optimum
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
      comment_bot_token: ${{ secrets.COMMENT_BOT_TOKEN }}
