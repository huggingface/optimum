name: GPTQ / Python - Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/gptq/**
      - optimum/gptq/**
      - .github/workflows/test_gptq.yml
  pull_request:
    branches: [main]
    paths:
      - tests/gptq/**
      - optimum/gptq/**
      - .github/workflows/test_gptq.yml
  schedule:
    # every day at midnight
    - cron: "0 0 * * *"

env:
  UV_SYSTEM_PYTHON: 1
  HF_HOME: /mnt/cache/
  TRANSFORMERS_IS_CI: true

permissions: {}

jobs:
  test_gptq:
    permissions:
      contents: read
    runs-on:
      group: aws-g6-4xlarge-plus

    container:
      image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
      options: --gpus all --shm-size 16G --volume /mnt/cache/:/mnt/cache/

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
          uv pip install .[tests]
          uv pip install pypcre "setuptools>=78.1.1,<82"
          uv pip install "gptqmodel>=7.0.0"

      - name: Run tests
        run: |
          pytest tests/gptq -s -vvvv --durations=0
