name: Build PR documentation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "optimum/**.py"
      - "docs/**.mdx"
      - "docs/**.yml"
      - ".github/workflows/build_pr_documentation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: 1
  UV_TORCH_BACKEND: auto

jobs:
  build_documentation:
    runs-on: ubuntu-22.04
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.number }}
      EVENT_CONTEXT: ${{ toJSON(github.event) }}
      PR_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache-dependency-path: "kit/package-lock.json"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "huggingface/optimum"
          path: optimum

      - name: Setup environment
        run: |
          pip install --upgrade pip uv
          uv pip install git+https://github.com/huggingface/doc-builder

      - name: Make Optimum documentation
        run: |
          cd optimum
          uv pip install . --no-deps
          doc-builder light-install optimum
          make doc BUILD_DIR=optimum-doc-build VERSION=pr_$PR_NUMBER
          cd ..

      - name: Combine subpackage documentation
        run: |
          cd optimum
          sudo python docs/combine_docs.py --subpackages nvidia habana intel neuron tpu furiosa executorch onnx --version pr_$PR_NUMBER
          sudo mv optimum-doc-build ../
          cd ..

      - name: Save commit_sha & pr_number
        run: |
          sudo chmod -R ugo+rwx optimum-doc-build
          cd optimum-doc-build
          echo ${{ env.COMMIT_SHA }} > ./commit_sha
          echo ${{ env.PR_NUMBER }} > ./pr_number

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-build-artifact
          path: optimum-doc-build/
